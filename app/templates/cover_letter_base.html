<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Letter - {{ candidate_name }}</title>
    <style>
        @page {
            size: A4;
            margin: 2cm;
        }
        
        body {
            font-family: 'Arial', 'Helvetica', sans-serif;
            font-size: 11pt;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        .candidate-info {
            text-align: left;
            margin-bottom: 40px;
        }
        
        .candidate-name {
            font-size: 16pt;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .candidate-title {
            font-size: 11pt;
            color: #666;
            margin-bottom: 10px;
        }
        
        .candidate-contact {
            font-size: 10pt;
            color: #666;
        }
        
        .date {
            text-align: right;
            margin-bottom: 30px;
            font-size: 10pt;
        }
        
        .recipient {
            margin-bottom: 30px;
        }
        
        .company-name {
            font-weight: bold;
            font-size: 12pt;
        }
        
        .position {
            font-style: italic;
            color: #555;
        }
        
        .letter-body {
            text-align: justify;
            white-space: pre-wrap;
            margin-bottom: 30px;
        }
        
        .signature {
            margin-top: 40px;
        }
        
        .signature-name {
            font-weight: bold;
            margin-top: 60px;
        }
        
        hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="candidate-info">
            <div class="candidate-name">{{ candidate_name }}</div>
            <div class="candidate-title">{{ candidate_title }}</div>
            <div class="candidate-contact">
                {{ candidate_email }} | {{ candidate_phone }}
            </div>
        </div>
        
        <div class="date">{{ date }}</div>
        
        <div class="recipient">
            <div class="company-name">{{ company }}</div>
            <div class="position">Re: {{ position }}</div>
        </div>
    </div>
    
    <div class="letter-body">{{ cover_letter_text }}</div>
    
    <div class="signature">
        <div class="signature-name">{{ candidate_name }}</div>
    </div>
</body>
</html>

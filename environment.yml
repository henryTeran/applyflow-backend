# ApplyFlow Backend - Conda Environment

name: applyflow
channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.11

  # Core dependencies (install via conda when possible for better compatibility)
  - pip
  - postgresql
  - psycopg2
  
  # Development tools
  - ipython
  - pytest
  - black
  - isort
  - mypy

  # Pip dependencies (packages not available or better via pip)
  - pip:
    # FastAPI and server
    - fastapi==0.109.0
    - uvicorn[standard]==0.27.0
    - python-multipart==0.0.6
    
    # Database
    - sqlalchemy==2.0.25
    - alembic==1.13.1
    
    # Pydantic settings
    - pydantic==2.5.3
    - pydantic-settings==2.1.0
    - python-dotenv==1.0.0
    
    # PDF generation
    - weasyprint==60.2
    - jinja2==3.1.3
    
    # Email
    - aiosmtplib==3.0.1
    
    # OpenAI
    - openai==1.10.0
    
    # Authentication & Security
    - python-jose[cryptography]==3.3.0
    - passlib[bcrypt]==1.7.4
    
    # Rate Limiting
    - slowapi==0.1.9
    
    # Logging
    - structlog==24.1.0
    - python-json-logger==2.0.7
    
    # Background Tasks
    - celery==5.3.4
    - redis==5.0.1
    
    # File Upload
    - aiofiles==23.2.1
    
    # Testing
    - pytest==7.4.3
    - pytest-asyncio==0.21.1
    - httpx==0.25.2
    - faker==22.0.0
    
    # Utilities
    - python-dateutil==2.8.2
    - pytz==2024.1
